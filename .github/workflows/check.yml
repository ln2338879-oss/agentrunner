name: AgentRunner Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: |
          if [ -f bun.lock ] || [ -f bun.lockb ]; then
            bun install --frozen-lockfile --silent
          else
            echo "No Bun lockfile found; running non-frozen install. Commit bun.lock or bun.lockb to enforce reproducible installs."
            bun install --silent
          fi

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: bun run typecheck --pretty false > typecheck.log 2>&1

      - name: Upload typecheck diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-log
          path: typecheck.log

      - name: Fail on typecheck errors
        if: steps.typecheck.outcome == 'failure'
        run: cat typecheck.log && exit 1

      - name: Lint
        id: lint
        continue-on-error: true
        run: bun run lint > lint.log 2>&1

      - name: Upload lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-log
          path: lint.log

      - name: Fail on lint errors
        if: steps.lint.outcome == 'failure'
        run: cat lint.log && exit 1

      - name: Format check
        run: bun run format:check

      - name: Test
        id: test
        continue-on-error: true
        run: bun test > test.log 2>&1

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test.log

      - name: Fail on test errors
        if: steps.test.outcome == 'failure'
        run: cat test.log && exit 1

      - name: Build
        id: build
        continue-on-error: true
        run: bun run build > build.log 2>&1

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Fail on build errors
        if: steps.build.outcome == 'failure'
        run: cat build.log && exit 1

      - name: Code quality budget
        run: bun run quality:budget
